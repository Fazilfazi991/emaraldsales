  <script>
  (()=>{'use strict';
    const KEY='fusion-emerald-interlink-field-crm-v1';
    const TEAM=[{id:'ahmed',name:'Ahmed Hassan',role:'Sales Executive',initials:'AH'},{id:'shihab',name:'Shihab K.',role:'Sales Executive',initials:'SK'},{id:'naseer',name:'Naseer M.',role:'Sales Executive',initials:'NM'},{id:'manager',name:'Manager / Admin',role:'Manager',initials:'MA'}];
    const AREAS=['Al Quoz','Deira','Ras Al Khor','Al Qusais','Dubai Investment Park','Al Barsha','Jebel Ali'];
    const shopNames=['Al Noor Building Materials','Falcon Hardware Trading','Golden Star Building Materials','Royal Touch Hardware','Dubai Modern Trading','Al Falah Building Materials','Bright Star Hardware','Emirates Technical Trading','Green Line Building Materials','Prime Hardware Trading','Union Build Mart','Starline Building Supplies','Al Safa Hardware','Crescent Building Materials','National Pearl Trading','City Link Hardware','Sunrise Building Products','Metro Fix Trading','Blue Stone Hardware','Grandline Building Materials','Desert Gate Trading','Northstar Hardware','New Horizon Building Supply','Capital Star Trading','Al Huda Building Materials','Rapid Tools & Hardware','Evergreen Building Products','Atlas Point Trading','Topline Hardware Supply','Al Madina Building Materials','Silver Crest Hardware','Buildwell Trading','Oasis Technical Supply','Express Board & Hardware','Cornerstone Building Materials','Al Reef Hardware Trading'];
    const people=['Mohammed Rahman','Arif Khan','Rashid Ali','Sameer Ahmed','Faisal Karim','Ibrahim Noor','Hassan Malik','Khalid Farooq','Omar Abbas','Salim Yousuf','Imran Shah','Bilal Hamad'];
    const areas=AREAS;
    const pad=n=>String(n).padStart(2,'0');
    const dateOffset=days=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+days);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
    const today=()=>dateOffset(0);
    const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const byId=id=>state.shops.find(s=>s.id===id);
    const staff=id=>TEAM.find(m=>m.id===id)?.name||'Unassigned';
    const fmtDate=(value,opts={day:'numeric',month:'short',year:'numeric'})=>value?new Intl.DateTimeFormat('en-AE',opts).format(new Date(`${value}T12:00:00`)):'—';
    const fmtTime=iso=>iso?new Intl.DateTimeFormat('en-AE',{hour:'numeric',minute:'2-digit'}).format(new Date(iso)):'—';
    const dayOffset=(value)=>Math.round((new Date(`${value}T12:00:00`)-new Date(`${today()}T12:00:00`))/864e5);
    const uid=prefix=>`${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,6)}`;
    const escapePhone=n=>n.replace(/(\d{2})(\d{3})(\d{4})$/, '$1 $2 $3');
    function seed(){
      const visits=[];let serial=1;
      for(let i=0;i<shopNames.length;i++){
        const count=i===0?8:i===1?12:i===2?5:i===3?3:i===4?1:[0,2,5,1,3,0,4,1,2,0,6,3,1,4,0,2,1,5,0,3,1,2,0,4,2,1,6,0,3,1,2][(i-5)%31];

          const date=dateOffset(-daysAgo);const rep=TEAM[(i+j)%3].id;const start=new Date(`${date}T${pad(9+(i+j)%7)}:${pad((i*13+j*17)%60)}:00`);
          visits.push({id:`visit-seed-${serial++}`,shopId:`shop-${i+1}`,salespersonId:rep,checkedInAt:start.toISOString(),checkedOutAt:new Date(start.getTime()+(14+(i+j*3)%17)*6e4).toISOString(),status:['Regular Visit','Follow-up Required','Order Expected','Interested','Customer Not Available'][(i+j)%5],notes:(i===0&&j===count-1)?'Customer requested updated pricing on cement boards. They may need approximately 50 pieces next week.':(j%4===0?'Discussed the current stock position and latest building-material requirements.':j%4===1?'Shared the updated product range. Follow up after the next replenishment.':j%4===2?'Quick relationship visit. The shop currently has sufficient stock.':'Met the store team and discussed upcoming project demand.'),orderStatus:['No Order','Order Expected','No Order','Order Received'][(i+j)%4],orderNote:j%3===1?'Customer will confirm quantities next visit.':'',orderValue:j%5===0?4200+(i*235):null,followUpDate:j%4===1?dateOffset(-Math.max(0,daysAgo-3)):null,location:areas[(i+j)%areas.length],durationMinutes:14+(i+j*3)%17});

    function filteredShops(list){const f=state.filters,q=f.search.trim().toLowerCase();return list.filter(s=>{const hay=[s.name,s.contact,s.phone,s.area,s.location].join(' ').toLowerCase();if(q&&!hay.includes(q))return false;if(f.person!=='all'&&s.salespersonId!==f.person)return false;if(f.area!=='all'&&s.area!==f.area)return false;if(f.status!=='all'&&s.status!==f.status)return false;if(f.when==='due'&&!s.nextFollowUp)return false;if(f.when==='visited'&&!s.lastVisit)return false;if(f.when==='never'&&s.lastVisit)return false;return true})}

iv>`)}</div><aside class="stack">${panel('Shop information','Kept together for every field visit',`<div class="panel-body"><div class="grid-two"><div class="fact"><label>Contact person</label><strong>${escapeHTML(s.contact||'Not added')}</strong></div><div class="fact"><label>Mobile</label><strong>${escapeHTML(s.phone||'Not added')}</strong></div><div class="fact"><label>Area</label><strong>${escapeHTML(s.area||'Not added')}</strong></div><div class="fact"><label>Added to CRM</label><strong>${fmtDate(s.createdAt||today())}</strong></div><div class="fact" style="grid-column:1/-1"><label>Location</label><strong>${escapeHTML(s.location||s.area)}</strong></div></div>${s.notes&&s.notes!=='Fictional demo account.'?`<p class="subheading" style="margin-top:12px">${escapeHTML(s.notes)}</p>`:''}</div>`)}${s.nextFollowUp?panel('Next follow-up',dateLabel(due),`<div class="panel-body"><div class="activity-row">${avatar(s.salespersonId)}<div class="activity-copy"><strong>${fmtDate(s.nextFollowUp)}</strong><p>${escapeHTML(staff(s.salespersonId))} · Visit this shop</p></div>${badge(due<0?'Overdue':'Scheduled')}</div></div>`):'<div class="notice">Set a follow-up date in the visit check-out form. It will stay linked to this shop.</div>'}</aside></div>`}
    function visibleVisitList(){const f=state.visitFilters;const q=f.search.trim().toLowerCase();return state.visits.slice().sort((a,b)=>b.checkedInAt.localeCompare(a.checkedInAt)).filter(v=>{const s=byId(v.shopId);if(!s)return false;if(!within(v,f.when))return false;if(f.person!=='all'&&v.salespersonId!==f.person)return false;if(f.area!=='all'&&s.area!==f.area)return false;if(f.status!=='all'&&v.status!==f.status)return false;if(q&&![s.name,s.contact,s.area,staff(v.salespersonId),v.notes].join(' ').toLowerCase().includes(q))return false;return true})}
    function renderVisits(){const f=state.visitFilters;const list=visibleVisitList();const toolbarHtml=`<div class="toolbar"><label class="search"><span class="search-icon">⌕</span><input class="input" data-visit-search value="${escapeHTML(f.search)}" placeholder="Search shop or salesperson…" aria-label="Search visits"></label><select class="select" data-vfilter="when" aria-label="Filter by date"><option value="all">All dates</option><option value="today" ${f.when==='today'?'selected':''}>Today</option><option value="yesterday" ${f.when==='yesterday'?'selected':''}>Yesterday</option><option value="week" ${f.when==='week'?'selected':''}>This week</option><option value="month" ${f.when==='month'?'selected':''}>This month</option></select><select class="select" data-vfilter="person" aria-label="Filter visits by salesperson"><option value="all">All executives</option>${TEAM.filter(t=>t.id!=='manager').map(t=>`<option value="${t.id}" ${f.person===t.id?'selected':''}>${t.name}</option>`).join('')}</select><select class="select" data-vfilter="area" aria-label="Filter visits by area"><option value="all">All areas</option>${AREAS.map(a=>`<option ${f.area===a?'selected':''}>${a}</option>`).join('')}</select><select class="select" data-vfilter="status" aria-label="Filter visits by status"><option value="all">All statuses</option>${['Regular Visit','Follow-up Required','Order Expected','Order Received','Interested','Customer Not Available','Not Interested','New Opportunity','Closed','Currently Visiting'].map(a=>`<option ${f.status===a?'selected':''}>${a}</option>`).join('')}</select><span class="results">${list.length} visits</span></div>`;const rows=list.map(v=>{const s=byId(v.shopId);return`<tr><td data-label="DATE">${fmtDate(v.checkedInAt.slice(0,10),{day:'numeric',month:'short'})}<span class="cell-sub">${new Intl.DateTimeFormat('en-AE',{weekday:'short'}).format(new Date(v.checkedInAt))}</span></td><td data-label="SALESPERSON">${personCell(v.salespersonId)}</td><td data-label="SHOP"> <button class="shop-link cell-title" data-open-shop="${s.id}">${escapeHTML(s.name)}</button><span class="cell-sub">${escapeHTML(s.area)}</span></td><td data-label="CHECK IN">${fmtTime(v.checkedInAt)}</td><td data-label="CHECK OUT">${fmtTime(v.checkedOutAt)}</td><td data-label="DURATION">${duration(v)}</td><td data-label="STATUS">${badge(v.checkedOutAt?v.status:'Currently Visiting')}</td><td data-label="FOLLOW-UP">${v.followUpDate?fmtDate(v.followUpDate,{day:'numeric',month:'short'}):'—'}</td></tr>`}).join('');const countToday=state.visits.filter(isToday).length;return`${pageHeading('All field activity','Visit history','Every check-in, check-out, discussion and follow-up, in one searchable history.')}<div class="panel">${toolbarHtml}<div class="summary-strip"><span><b>${countToday}</b> visits today</span><span><b>${list.filter(v=>!v.checkedOutAt).length}</b> in progress</span><span><b>${list.filter(v=>v.orderStatus==='Order Received').length}</b> order notes logged</span></div><div class="table-wrap mobile-cards"><table><thead><tr><th>DATE</th><th>SALES EXECUTIVE</th><th>SHOP / AREA</th><th>CHECK IN</th><th>CHECK OUT</th><th>DURATION</th><th>VISIT STATUS</th><th>FOLLOW-UP</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">No visits match these filters.</td></tr>'}</tbody></table></div></div>`}
    function renderTeam(){const ms=TEAM.filter(t=>t.id!=='manager');const cards=ms.map(m=>{const td=state.visits.filter(isToday).filter(v=>v.salespersonId===m.id),all=state.visits.filter(v=>v.salespersonId===m.id),recent=all.sort((a,b)=>b.checkedInAt.localeCompare(a.checkedInAt))[0],leads=state.shops.filter(s=>s.lead&&s.createdBy===m.id).length,due=state.shops.filter(s=>s.salespersonId===m.id&&s.nextFollowUp).length;return`<button type="button" class="team-card" data-person-history="${m.id}" style="width:100%;text-align:left"><div class="team-top">${avatar(m.id)}<span><strong>${escapeHTML(m.name)}</strong><small>Sales Executive · Dubai field team</small></span></div><div class="team-stats"><div class="team-stat"><b>${td.filter(v=>v.checkedOutAt).length}</b><span>Visits today</span></div><div class="team-stat"><b>${all.filter(v=>dayOffset(v.checkedInAt.slice(0,10))>=-6).length}</b><span>Visits this week</span></div><div class="team-stat"><b>${leads}</b><span>New leads</span></div></div><div class="team-stats"><div class="team-stat"><b>${due}</b><span>Follow-ups pending</span></div><div class="team-stat" style="grid-column:span 2"><b style="font-size:10px">${recent?fmtDate(recent.checkedInAt.slice(0,10),{day:'numeric',month:'short'})+' · '+fmtTime(recent.checkedInAt):'No visit activity'}</b><span>Last shop visit</span></div></div><div style="display:flex;align-items:center;justify-content:space-between;color:var(--green);font-size:9px;font-weight:650">View visit history <span>→</span></div></button>`}).join('');return`${pageHeading('Field team','Sales executives','Daily progress for the three-person field team. Add more executives as the business grows.')}<div class="team-grid">${cards}</div>${panel('Today’s field activity','Visits grouped by each salesperson',`<div class="panel-body">${ms.map(m=>{const vs=state.visits.filter(v=>v.salespersonId===m.id&&isToday(v));return`<div class="activity-row">${avatar(m.id)}<div class="activity-copy"><strong>${escapeHTML(m.name)}</strong><p>${vs.length} visits today · ${vs.filter(v=>v.checkedOutAt).length} completed</p></div><button class="button small" data-person-history="${m.id}">View history</button></div>`}).join('')}</div>`)}`}
    function showPersonHistory(id){state.visitFilters={...state.visitFilters,person:id,when:'all',search:''};state.view='visits';render();toast(`${staff(id)} · all recorded field visits`)}
    function render(){makeNavigation();makeSelector();document.getElementById('crumb').textContent=state.selectedShopId?'Shop profile':navItems.find(n=>n[0]===state.view)?.[2]||'Dashboard';const content=document.getElementById('content');content.innerHTML=state.selectedShopId?renderShopProfile(state.selectedShopId):state.view==='dashboard'?renderDashboard():state.view==='shops'?renderShops():state.view==='visits'?renderVisits():state.view==='leads'?renderShops(true):renderTeam();save()}
    function navigate(view){if((view==='shops'||view==='leads')&&view!==state.view)state.filters={search:'',person:'all',area:'all',status:'all',when:'all'};state.view=view;state.selectedShopId=null;if(window.matchMedia('(max-width:700px)').matches)window.scrollTo(0,0);render()}
    function openShop(shopId,from=state.view){if(!byId(shopId))return;state.profileFrom=from;state.selectedShopId=shopId;state.view=from==='visits'?'visits':from==='leads'?'leads':'shops';render();document.getElementById('content').focus({preventScroll:true});window.scrollTo(0,0)}
    function field(name,label,type='text',opts={}){const {value='',required=false,placeholder='',choices=[],hint='',wide=false,min='',step=''}=opts;let inner='';if(type==='select'){inner=`<select class="select" name="${name}" ${required?'required':''}>${choices.map(([v,t])=>`<option value="${escapeHTML(v)}" ${v===value?'selected':''}>${escapeHTML(t)}</option>`).join('')}</select>`}else if(type==='textarea'){inner=`<textarea class="textarea" name="${name}" placeholder="${escapeHTML(placeholder)}" ${required?'required':''}>${escapeHTML(value)}</textarea>`}else{inner=`<input class="input" name="${name}" type="${type}" value="${escapeHTML(value)}" placeholder="${escapeHTML(placeholder)}" ${required?'required':''} ${min?`min="${min}"`:''} ${step?`step="${step}"`:''}>`}return`<div class="form-field ${wide?'full':''}"><label for="field-${name}">${label}${required?' *':''}</label>${inner.replace(/name="([^"]+)"/,`id="field-${name}" name="$1"`)}${hint?`<p class="help">${hint}</p>`:''}</div>`}
    const dialog=document.getElementById('dialog');
    function showDialog(title,description,body,actions){document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogDescription').textContent=description||'';document.getElementById('dialogBody').innerHTML=body;document.getElementById('dialogFoot').innerHTML=actions;dialog.showModal();requestAnimationFrame(()=>dialog.querySelector('input:not([type="hidden"]),select,button')?.focus())}
    function closeDialog(){if(dialog.open)dialog.close()}
    function addShopForm(){const choices=TEAM.filter(m=>m.id!=='manager').map(t=>[t.id,t.name]);showDialog('Add a new shop','Capture a new shop as you discover it on the road. It becomes a lead immediately.','<div class="form-grid">'+field('name','Shop name','text',{required:true,placeholder:'e.g. Emerald Star Hardware',wide:true})+field('contact','Contact person','text',{placeholder:'Shop owner or manager'})+field('phone','Mobile','tel',{placeholder:'+971 50 000 0000'})+field('area','Area','select',{required:true,choices:AREAS.map(a=>[a,a]),value:'Al Quoz'})+field('salespersonId','Sales executive','select',{choices,value:state.salesperson==='manager'?'ahmed':state.salesperson})+field('location','Location','text',{placeholder:'Street or district, Dubai',wide:true})+field('notes','Notes','textarea',{placeholder:'Any useful details from the first conversation.',wide:true})+'</div><p class="help">Status: New Lead · Fictional data is saved locally in this browser.</p>',`<button type="button" class="button" data-dismiss>Cancel</button><button type="submit" name="intent" value="save" class="button primary">Save New Shop</button><button type="submit" name="intent" value="checkin" class="button primary">Save & Check In</button>`)}
    const statusOptions=['Regular Visit','Follow-up Required','Order Expected','Order Received','Not Interested','Customer Not Available','Closed','New Opportunity'];
    const orderOptions=['No Order','Order Expected','Order Received'];
    function checkin(shopId){if(!byId(shopId))return;const existing=state.visits.find(v=>v.shopId===shopId&&!v.checkedOutAt);if(existing){if(existing.salespersonId===state.salesperson)showDialog('Already checked in','This visit is active.',`<div class="notice">Checked in at ${fmtTime(existing.checkedInAt)}. Record the discussion and check out when you finish the visit.</div>`,`<button type="button" class="button" data-dismiss>Close</button><button class="button primary" type="button" data-checkout="${existing.id}" data-dialog-action>Open checkout</button>`);else toast(`This shop already has an active visit with ${staff(existing.salespersonId)}.`);return}const s=byId(shopId),when=new Date(),visit={id:uid('visit'),shopId,salespersonId:state.salesperson==='manager'?'ahmed':state.salesperson,checkedInAt:when.toISOString(),checkedOutAt:null,status:'Currently Visiting',notes:'',orderStatus:'No Order',orderNote:'',orderValue:null,followUpDate:null,location:s.location||`${s.area}, Dubai`};state.visits.unshift(visit);s.visitIds.unshift(visit.id);s.lastVisit=today();save();render();toast(`Checked in to ${s.name} · ${fmtTime(visit.checkedInAt)}`);if(navigator.geolocation&&window.isSecureContext)navigator.geolocation.getCurrentPosition(pos=>{visit.gps={latitude:+pos.coords.latitude.toFixed(5),longitude:+pos.coords.longitude.toFixed(5)};visit.location=`GPS captured · ${visit.gps.latitude}, ${visit.gps.longitude}`;save();if(state.selectedShopId===shopId)render()},()=>{}, {maximumAge:6e4,timeout:2500})}
    function checkout(id){const v=state.visits.find(x=>x.id===id);if(!v)return;const s=byId(v.shopId);const existingStatus=statusOptions.includes(v.status)?v.status:'Regular Visit';showDialog('Record this shop visit',`${s?.name||'Shop'} · checked in at ${fmtTime(v.checkedInAt)}`,`<div class="form-grid">${field('status','Visit status','select',{required:true,value:existingStatus,choices:statusOptions.map(x=>[x,x])})}${field('orderStatus','Order status','select',{value:v.orderStatus||'No Order',choices:orderOptions.map(x=>[x,x])})}${field('notes','Discussion / visit notes','textarea',{wide:true,required:true,value:v.notes==='Reviewing this week’s stock needs.'?'':v.notes,placeholder:'What did the customer say? What happened during this visit?'})}${field('orderNote','Order note / reference','text',{wide:true,value:v.orderNote||'',placeholder:'A short note about order interest, if relevant'})}${field('orderValue','Approximate order value · AED','number',{value:v.orderValue||'',min:'0',step:'100',placeholder:'Optional, not an invoice'})}${field('followUpDate','Next follow-up','date',{value:v.followUpDate||s?.nextFollowUp||'',min:today(),hint:'Optional. A date will make this shop appear in follow-ups due.'})}</div><div class="map-chip" style="margin-top:11px">⌖ ${escapeHTML(v.location||s?.area||'Dubai')} · ${v.gps?'GPS captured':'Demo shop location'}</div>`,`<button type="button" class="button" data-dismiss>Cancel</button><button type="submit" name="intent" value="save" class="button primary">Check Out · Save Visit</button>`);document.querySelector('[name="intent"][value="save"]').dataset.checkoutId=id}
    function saveCheckout(form,id){const v=state.visits.find(x=>x.id===id);if(!v)return;const fd=new FormData(form);const checkedAt=new Date().toISOString();v.checkedOutAt=checkedAt;v.durationMinutes=Math.max(1,Math.round((new Date(checkedAt)-new Date(v.checkedInAt))/6e4));v.status=String(fd.get('status'));v.notes=String(fd.get('notes')||'');v.orderStatus=String(fd.get('orderStatus')||'No Order');v.orderNote=String(fd.get('orderNote')||'');v.orderValue=fd.get('orderValue')?Number(fd.get('orderValue')):null;v.followUpDate=String(fd.get('followUpDate')||'')||null;const s=byId(v.shopId);if(s){s.lastVisit=v.checkedInAt.slice(0,10);s.salespersonId=v.salespersonId;s.status=s.lead?(v.status==='Not Interested'?'Not Interested':v.status==='New Opportunity'?'Interested':'Contacted'):v.status==='Not Interested'?'Not Interested':'Customer';s.nextFollowUp=v.followUpDate;if(s.lead&&['Order Expected','Order Received','New Opportunity','Interested'].includes(v.status))s.status='Interested';}save();closeDialog();render();toast(`Visit saved · ${duration(v)} · ${s?.name||'Shop'}`)}
    function escapeAll(s){return escapeHTML(s)}
    function submitShop(form,intent){const fd=new FormData(form);const name=String(fd.get('name')||'').trim();if(!name){form.elements.name.focus();return}const id=uid('shop'),rep=String(fd.get('salespersonId')||state.salesperson||'ahmed');const shop={id,name,contact:String(fd.get('contact')||'').trim(),phone:String(fd.get('phone')||'').trim(),area:String(fd.get('area')||'Al Quoz'),location:String(fd.get('location')||fd.get('area')+', Dubai').trim(),salespersonId:rep,createdBy:rep,createdAt:today(),status:'New Lead',notes:String(fd.get('notes')||'').trim(),lead:true,lastVisit:null,nextFollowUp:null,visitIds:[],isSeed:false};state.shops.unshift(shop);closeDialog();state.view='leads';state.selectedShopId=id;if(intent==='checkin'){state.view='shops';checkin(id)}else{save();render();toast(`${shop.name} added as a new shop lead`)}}
    function resetDemo(){showDialog('Reset demo data','Restore the original fictional shops and visit history? Any changes made in this browser will be removed.',`<div class="notice">${state.shops.length} shops and ${state.visits.length} visit records will be reset to their starting demonstration values.</div>`,`<button type="button" class="button" data-dismiss>Keep my changes</button><button type="button" class="button primary" data-reset-confirm>Reset Demo Data</button>`)}
    function doReset(){state=seed();save();closeDialog();render();toast('Fictional demo workspace restored.')}
    document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.hasAttribute('data-view')){navigate(t.dataset.view);return}if(t.hasAttribute('data-open-shop')){openShop(t.dataset.openShop);return}if(t.hasAttribute('data-add-shop')){addShopForm();return}if(t.hasAttribute('data-checkin')){checkin(t.dataset.checkin);return}if(t.hasAttribute('data-checkout')){checkout(t.dataset.checkout);return}if(t.hasAttribute('data-person-history')){showPersonHistory(t.dataset.personHistory);return}if(t.hasAttribute('data-back')){state.selectedShopId=null;state.view=state.profileFrom==='visits'?'visits':state.profileFrom==='leads'?'leads':'shops';render();return}if(t.hasAttribute('data-dismiss')){closeDialog();return}if(t.hasAttribute('data-reset-confirm')){doReset();return}if(t.hasAttribute('data-dialog-action')){checkout(t.dataset.checkout);return}});
    document.getElementById('content').addEventListener('input',e=>{if(e.target.matches('[data-shop-search]')){const input=e.target;state.filters.search=input.value;const pos=input.selectionStart;const list=state.view==='leads'?state.shops.filter(s=>s.lead):state.shops;const container=input.closest('.panel');const old=container?.querySelector('.table-wrap');if(old){const replacement=document.createElement('div');replacement.innerHTML=shopTable(filteredShops(list));old.replaceWith(replacement.firstElementChild);const count=container.querySelector('.results');if(count)count.textContent=`${filteredShops(list).length} ${state.view==='leads'?'leads':'shops'}`;const next=container.querySelector('[data-shop-search]');if(next){next.focus();next.setSelectionRange(pos,pos)}}save()}if(e.target.matches('[data-visit-search]')){state.visitFilters.search=e.target.value;const input=e.target;const pos=input.selectionStart;const wrap=input.closest('.panel').querySelector('.table-wrap');const next=document.createElement('div');next.innerHTML=visitRowsOnly();wrap.replaceWith(next.firstElementChild);const field=document.querySelector('[data-visit-search]');field?.focus();field?.setSelectionRange(pos,pos);const count=document.querySelector('.results');if(count)count.textContent=`${visibleVisitList().length} visits`;save()}});
    function visitRowsOnly(){const rows=visibleVisitList().map(v=>{const s=byId(v.shopId);return`<tr><td data-label="DATE">${fmtDate(v.checkedInAt.slice(0,10),{day:'numeric',month:'short'})}<span class="cell-sub">${new Intl.DateTimeFormat('en-AE',{weekday:'short'}).format(new Date(v.checkedInAt))}</span></td><td data-label="SALESPERSON">${personCell(v.salespersonId)}</td><td data-label="SHOP"> <button class="shop-link cell-title" data-open-shop="${s.id}">${escapeHTML(s.name)}</button><span class="cell-sub">${escapeHTML(s.area)}</span></td><td data-label="CHECK IN">${fmtTime(v.checkedInAt)}</td><td data-label="CHECK OUT">${fmtTime(v.checkedOutAt)}</td><td data-label="DURATION">${duration(v)}</td><td data-label="STATUS">${badge(v.checkedOutAt?v.status:'Currently Visiting')}</td><td data-label="FOLLOW-UP">${v.followUpDate?fmtDate(v.followUpDate,{day:'numeric',month:'short'}):'—'}</td></tr>`}).join('');return`<div class="table-wrap mobile-cards"><table><thead><tr><th>DATE</th><th>SALES EXECUTIVE</th><th>SHOP / AREA</th><th>CHECK IN</th><th>CHECK OUT</th><th>DURATION</th><th>VISIT STATUS</th><th>FOLLOW-UP</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">No visits match these filters.</td></tr>'}</tbody></table></div>`}
    document.getElementById('content').addEventListener('change',e=>{const t=e.target;if(t.matches('[data-filter]')){state.filters[t.dataset.filter]=t.value;render()}if(t.matches('[data-vfilter]')){state.visitFilters[t.dataset.vfilter]=t.value;render()}if(t.id==='salesperson'){state.salesperson=t.value;if(state.selectedShopId)render();save();toast(`Viewing as ${staff(t.value)}`)}});
    document.getElementById('dialogForm').addEventListener('submit',e=>{const submitter=e.submitter;const checkoutId=submitter?.dataset.checkoutId;if(checkoutId){e.preventDefault();const form=e.currentTarget;if(!form.reportValidity())return;saveCheckout(form,checkoutId);return}if(submitter?.value==='save'||submitter?.value==='checkin'){e.preventDefault();submitShop(e.currentTarget,submitter.value)}});
    dialog.addEventListener('click',e=>{if(e.target===dialog)closeDialog()});
    document.getElementById('resetData').addEventListener('click',resetDemo);
    render();
  })();
  </script>
</body>
</html>
